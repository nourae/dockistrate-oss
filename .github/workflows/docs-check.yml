name: Documentation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test documentation checks
        run: python3 -m unittest discover -s tests -p 'documentation_*.py'
      - name: Check links, assets, and interactive coverage
        run: python3 scripts/docs/check_documentation.py --public-export
