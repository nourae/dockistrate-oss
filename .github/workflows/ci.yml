  syntax-and-fast-tests-linux:
    needs: domain-config-tests-linux
    if: ${{ always() && !cancelled() }}
    name: Syntax and fast tests (${{ matrix.os == 'macos-latest' && 'macOS' || 'Linux' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
