        run: |
          test "$(command -v bash)" = "/bin/bash"
          if [ "${BASH_VERSINFO[0]}" -ne 3 ]; then
            echo "::error::macOS compatibility tests require system Bash 3; got ${BASH_VERSION}."
            exit 1
          fi
          /bin/bash --version

      - name: Print Bash version
        run: /bin/bash --version

      - name: Bash syntax check
        shell: bash
        run: |
          while IFS= read -r file; do
            /bin/bash -n "$file"
          done < <(git ls-files '*.sh' '*.bash')

      - name: Install ShellCheck
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Verify ShellCheck
        if: runner.os == 'Linux'
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "::error::ShellCheck is required on the Linux runner."
            exit 1
          fi
          shellcheck --version

      - name: Verify fast-suite dependencies
        run: |
          for dependency in python3 rsync; do
            if ! command -v "$dependency" >/dev/null 2>&1; then
              echo "::error::Install ${dependency} before starting the runner."
              exit 1
            fi
          done

      - name: ShellCheck project scripts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git ls-files '*.sh' '*.bash' |
            grep -v '^tests/lib/shunit2' |
            xargs shellcheck --severity=error

      - name: Run fast test suite
        run: TEST_RUN_SUITE=fast exec /bin/bash ./tests/run.sh

      - name: Require domain configuration suite success
        if: always() && !cancelled()
        env:
          DOMAIN_SUITE_RESULT: ${{ needs['domain-config-tests-linux'].result }}
        run: |
          if [ "$DOMAIN_SUITE_RESULT" != success ]; then
            echo "::error::Domain configuration suite did not pass: ${DOMAIN_SUITE_RESULT}."
