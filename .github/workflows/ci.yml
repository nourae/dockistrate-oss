# Public snapshot: GitHub-hosted CI only.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SKIP_DOCKER_CHECKS: true
  TEST_TIMEOUT_SECONDS: 180
  TEST_TIMEOUT_INTEGRATION_SECONDS: 900
  TEST_TIMEOUT_PERSISTED_RENDER_SECONDS: 1800
  TEST_TIMEOUT_GRACE_SECONDS: 5
  SHUNIT2_TIMING_TOP: 20

jobs:
  domain-config-tests-linux:
    name: Domain configuration (Linux, shard ${{ matrix.domain_shard_index }}/2)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        domain_shard_index: [0, 1]
    env:
      TEST_DOMAIN_SHARD_TOTAL: 2
      TEST_DOMAIN_SHARD_INDEX: ${{ matrix.domain_shard_index }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install macOS test dependencies
        if: runner.os == 'macOS' && runner.environment == 'github-hosted'
        run: brew list coreutils >/dev/null 2>&1 || brew install coreutils

      - name: Verify GNU coreutils
        run: |
          if ! /bin/bash ./tests/lib/run_with_timeout.sh --probe; then
            echo "::error::GNU coreutils is required (macOS: brew install coreutils)."
            exit 1
          fi

      - name: Prefer system Bash on macOS
        if: runner.os == 'macOS'
        run: echo "PATH=/bin:/usr/bin:${PATH}" >> "$GITHUB_ENV"

      - name: Verify macOS Bash resolution
        if: runner.os == 'macOS'
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(command -v bash)" = "/bin/bash"
          if [ "${BASH_VERSINFO[0]}" -ne 3 ]; then
            echo "::error::macOS compatibility tests require system Bash 3; got ${BASH_VERSION}."
            exit 1
          fi
          /bin/bash --version

      - name: Print Bash version
        run: /bin/bash --version

      - name: Verify domain-suite dependencies
        run: |
          for dependency in python3 rsync; do
            if ! command -v "$dependency" >/dev/null 2>&1; then
              echo "::error::Install ${dependency} before starting the runner."
              exit 1
            fi
          done

      - name: Run domain configuration suite
        run: TEST_RUN_SUITE=domain-config exec /bin/bash ./tests/run.sh

